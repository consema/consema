# Path-based area labels for .github/workflows/labeler.yml (actions/labeler
# v7 config: label -> list of match objects; rules without an `any`/`all`
# wrapper are OR-ed; inside a combinator `all-globs-to-all-files` requires
# every changed file to match every glob, and `!`-prefixed globs are
# independent negated matchers). Area labels are derived from paths only;
# `kind:` labels remain the human/PR-template merge gate (pr-labels.yml).

'area: core':
  # authoritative conformance layer (vectors / fixtures / oracles / corpora /
  # differential) — the spec repository's source-of-truth content
  - changed-files:
      - any-glob-to-any-file:
          - 'conformance/**'

'area: ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'

'area: docs':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
