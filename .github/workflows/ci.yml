# Consema (spec/conformance authority repo) CI after the six-repo split
# (2026-08-12): this repo holds the language-independent spec, RFCs,
# roadmap, audit evidence and the conformance arbitration layer
# (conformance/). The language implementations (consema-rs/go/ts/py/kt) run
# their own CI in their own repositories; this workflow only runs what this
# repo itself owns:
#
#   - oracles: differential oracles with documented skip paths (roadmap
#     §14.12 "differential"), three-OS matrix.
#   - shared-conformance-digest: recompute the aggregate sha256 of
#     conformance/vectors/*.json and assert it equals the frozen record
#     (docs/fc-manifest-0.13.0.json "conformance_suite.aggregate_sha256") so
#     a vector added or removed without updating the record fails CI.
#
# No repository secrets are required.
#
# Oracle skip contract: run-hcl-go-oracle.ps1 and run-plist-macos-oracle.ps1
# exit 3 when their documented skip path applies (conformance/oracles/
# hcl-go-v1/manifest.json and plist-macos-v1/manifest.json "skip_path"). The
# oracles job treats exit 0 (ran and passed) and exit 3 (documented skip) as
# success and any other exit code as failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + running repo scripts); none uploads artifacts or
# writes check runs, so the global minimum is sufficient for all jobs.
permissions:
  contents: read

jobs:
  # Differential oracles with documented skip paths (§14.12 "differential").
  # run-hcl-go-oracle.ps1: requires the pinned Go toolchain under
  # target/oracles/go-1.26.5; when absent it exits 3 (documented skip). The
  # pinned runtime facts (go.os=windows, windows_build=10.0.26200.0) can
  # only match a pinned Windows host, so hosted runners take the skip path.
  # run-plist-macos-oracle.ps1: runs on macOS (plutil + pinned Swift
  # toolchain per manifest runtime pins) and exits 3 on Windows/Linux
  # (documented skip). On the macOS leg the runner label is the unpinned
  # macos-latest image, so a host pin drift (macOS/Xcode/Swift version
  # mismatch against the manifest runtime pins, plan risk R-2) also takes
  # the documented skip (exit 3 with a stderr note) instead of failing;
  # pinned hosts run the differential and any genuine failure still exits
  # non-zero. Exit 3 is wired as success per the manifests' "skip_path"
  # records; any other non-zero exit fails the job.
  oracles:
    name: differential oracles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
      - name: run differential oracles (exit 3 = documented skip = success)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('run-hcl-go-oracle.ps1', 'run-plist-macos-oracle.ps1')) {
            $path = Join-Path $env:GITHUB_WORKSPACE "scripts/$script"
            Write-Output "==> $script"
            & $path
            $code = $LASTEXITCODE
            if ($code -eq 3) {
              Write-Output "${script}: documented skip (exit 3) treated as success"
              continue
            }
            if ($code -ne 0) {
              Write-Output "${script}: failed with exit code $code"
              exit $code
            }
          }
          # The loop can end on a documented skip, leaving $LASTEXITCODE at 3;
          # the runner dot-sources this inline script, so without an explicit
          # exit the leftover code would fail the step. Exit 0 here — a
          # genuine failure already exited non-zero in the loop above.
          exit 0

  # Conformance authority gate: recompute the aggregate sha256 over
  # conformance/vectors/*.json (byte-order sorted basenames, per-file sha256,
  # '{basename}:{digest}' joined by '\n' with no trailing newline, then
  # sha256 of that UTF-8 byte string; canonical checkout bytes, eol=lf per
  # .gitattributes) and assert it equals the frozen record
  # (docs/fc-manifest-0.13.0.json "conformance_suite.aggregate_sha256").
  # A vector added, removed or edited without updating the record fails CI —
  # the standing executor for the language-neutral conformance freeze
  # (18 suites / 508 cases).
  shared-conformance-digest:
    name: conformance vectors aggregate digest (18 suites / 508 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: recompute aggregate digest and assert frozen record
        shell: bash
        run: |
          set -euo pipefail
          expected='35bebc8d384d71740f7c1a886bc50f4e095ff52fe05d2a407f04b842ee6922fa'
          vector_dir='conformance/vectors'
          : > /tmp/digest-input
          for f in $(LC_ALL=C ls "$vector_dir"/*.json | LC_ALL=C sort); do
            name=$(basename "$f")
            d=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s:%s\n' "$name" "$d" >> /tmp/digest-input
          done
          count=$(wc -l < /tmp/digest-input)
          digest=$(head -c -1 /tmp/digest-input | sha256sum | cut -d' ' -f1)
          echo "suites: $count"
          echo "aggregate sha256: $digest"
          if [ "$count" -ne 18 ]; then
            echo "::error::suite-count mismatch: expected 18 vector files, got $count"
            exit 1
          fi
          if [ "$digest" != "$expected" ]; then
            echo "::error::aggregate digest mismatch: expected $expected, got $digest"
            exit 1
          fi

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error or allowed-failures
  # semantics (the oracles exit-3 skip path is handled inside the job's
  # step), so no allowed-failures entry is needed.
  check:
    name: check (all gates green)
    if: always()
    needs: [oracles, shared-conformance-digest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
